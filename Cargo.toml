[package]
name = "my_word"
version = "0.1.0"
edition = "2024"
description = "A lightweight, high-performance Rust Word Processor focusing on accurate Vietnamese text input and A4 page simulation"
license = "MIT"
repository = "https://github.com/thieuhung1/my_word"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow"] }
egui = { version = "0.28", default-features = false }
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
